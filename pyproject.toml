[project]
name = "ragstack"
version = "0.1.0"
description = "Permission-aware hybrid RAG with a measured eval harness: Postgres+pgvector, RRF, reranking, contextual chunks, grounded citations, agentic retry."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Yassine Mazhare" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6",
    "docparse>=0.1",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
local = ["fastembed>=0.4"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
cohere = ["cohere>=5"]
all = ["ragstack[api,local,anthropic,openai,cohere]"]

[project.scripts]
ragstack = "ragstack.interfaces.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "reportlab>=4",
]

[tool.uv.sources]
docparse = { git = "https://github.com/Yassine-64/docparse.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragstack"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"src/ragstack/interfaces/**" = ["B008"]
"src/ragstack/infrastructure/repositories/*.py" = ["E501"]  # SQL strings stay on one line

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]
exclude = ["evals"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs Postgres (testcontainers/Docker)"]

[tool.coverage.run]
source = ["ragstack"]
