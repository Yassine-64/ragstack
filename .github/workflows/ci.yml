name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: paradedb/paradedb:0.26.2-pg16
        env: { POSTGRES_USER: ragstack, POSTGRES_PASSWORD: ragstack, POSTGRES_DB: ragstack }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U ragstack" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      RAGSTACK_TEST_DATABASE_URL: postgresql://ragstack:ragstack@localhost:5433/ragstack
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term-missing -q
      - name: offline eval gate (leak rate must be 0)
        run: |
          cat > .env <<EOT
          RAGSTACK_DATABASE_URL=$RAGSTACK_TEST_DATABASE_URL
          RAGSTACK_EMBEDDER=hashing
          RAGSTACK_RERANKER=lexical
          RAGSTACK_LLM=scripted
          EOT
          bash evals/seed.sh
          uv run ragstack eval evals/golden/handbook.jsonl --config evals/configs/hybrid-rerank.yaml
